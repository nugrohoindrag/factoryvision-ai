[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Alembic >=1.16 deprecates splitting prepend_sys_path on spaces, commas and
# colons. Without this, every command.upgrade() emits a DeprecationWarning,
# which the test suite now treats as an error.
path_separator = os
# The URL comes from app.db.engine.database_url() (FV_DATABASE_URL, FV_WAREHOUSE).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
