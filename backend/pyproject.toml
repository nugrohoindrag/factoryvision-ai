[project]
name = "factory-vision-ai-backend"
version = "0.1.0"
description = "Factory Vision AI backend: FastAPI, Google ADK agents, plant simulator"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "duckdb==1.5.6",
  "duckdb-engine==0.17.0",
  "fastapi==0.143.3",
  "google-cloud-bigquery==3.46.2",
  "httpx==0.28.1",
  "numpy==2.5.4",
  "ortools==9.15.6755",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy==2.1.5",
  "sqlalchemy-bigquery==1.17.3",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "types" }]

test = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-randomly>=5,<6",
  "time-machine>=3.5,<4",
  "diff-cover>=9,<10",
]

lint = [
  "ruff==0.17.1",
]

types = [
  "mypy==2.4.0",
]

planned = [
  "google-adk==1.14.1",
  "google-cloud-firestore==2.34.1",
  "google-cloud-pubsub==2.43.0",
  "google-cloud-storage==2.19.0",
  "google-genai==1.75.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "unit: pure logic, no I/O (base of the pyramid; runs on every change)",
  "integration: real DuckDB warehouse built with Alembic from the seed; no network",
  "e2e: running API (and later Vertex AI); opt-in with -m e2e",
]
filterwarnings = [
  "ignore::FutureWarning",
  "ignore::UserWarning",
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app", "simulator"]
omit = ["app/db/load_bigquery.py"]

[tool.ruff]
line-length = 160
target-version = "py312"
