name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Absolute on purpose: uv resolves a relative UV_PROJECT_ENVIRONMENT against
  # the *project* directory, so `.venv` here would build a second, stale
  # backend/.venv on whatever Python the runner defaults to.
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.7"
      - run: uv sync --project backend --python 3.12 --frozen
      - run: uv run --project backend --python 3.12 ruff check .
      - run: uv run --project backend --python 3.12 ruff format --check .

  backend-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.7"
      - run: uv sync --project backend --python 3.12 --frozen
      - run: uv run --project backend --python 3.12 mypy

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.7"
      - run: uv sync --project backend --python 3.12 --frozen
      - run: uv run --project backend --python 3.12 pytest -m unit
      - run: uv run --project backend --python 3.12 pytest -m integration

  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.7"
      - run: uv sync --project backend --python 3.12 --frozen
      - name: The generated error catalog must match the catalog in code
        run: |
          cd backend && uv run --project . --python 3.12 python -m app.errors
          cd .. && git diff --exit-code docs/error-catalog.md

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install the browser that smoke test needs
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (Playwright, dev server)
        run: npm --prefix frontend run test:e2e -- --project=desktop